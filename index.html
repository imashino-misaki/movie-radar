<script>
/* theme before first paint: stored choice, else the OS setting */
(function () {
  var s = null; try { s = localStorage.getItem("mr.theme"); } catch (e) {}
  var mq = matchMedia("(prefers-color-scheme: dark)");
  document.documentElement.dataset.theme = s || (mq.matches ? "dark" : "light");
  mq.addEventListener("change", function (e) { var c = null; try { c = localStorage.getItem("mr.theme"); } catch (x) {} if (!c) document.documentElement.dataset.theme = e.matches ? "dark" : "light"; });
})();
</script>
